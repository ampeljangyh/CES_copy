<script>
    document.addEventListener("DOMContentLoaded", function () {
        //로드 후 esg_cont 활성화
        //hashtag #1, #2, #3, #4 에 따라 다른 페이지 노출
        getHashOfName();
        gate0301Init();
        $('.esg_cont').css('visibility','');
    });

    window.addEventListener("hashchange", () => {
        getHashOfName();
        gate0301Init();
    });


    //애니메이션 처리
    const animEase = "power3.out";
    const animDefaults = { duration: 0.35, ease: animEase };
    const tl = gsap.timeline({ paused: true, reversed: true });

    gsap.set([".chk_panel", ".tit_box", ".chk_li", ".tit02 .tit"], { willChange: "width,height,margin,padding,opacity" });
    gsap.set(".tit02 .tit", { autoAlpha: 0 });

    tl.to(".ic_chk, .ico_esg", {
        y: -5,
        autoAlpha: 0,
        duration: 0.5,
        ease: animEase,
        onComplete: () => {
            gsap.set(".ico_esg", {
                position: "absolute",
                top: '50%',
                left: 0,
                marginTop: '-22px',
                marginLeft: 0,
                y: 0,     // 등장 위치 조정 가능
                autoAlpha: 0,
                scale: 0.6
            });
        }
    })
    .to(".ico_esg", { autoAlpha: 1, scale: 1, ...animDefaults })
    .to(".chk_li label > span", {
        paddingLeft: "68px",
        duration: 0.3,
        ease: animEase,
    },"<")
    .to(".chk_panel", { width: "1980px", ...animDefaults })
    .to(".chk_li", { height: "1084px", marginTop: "65px", paddingBottom: "124px", ...animDefaults }, "<")
    .to(".chk_panel", { paddingBottom: 0, ...animDefaults }, "<")
    .to(".tit01", { width: "830px", ...animDefaults })
    .to(".tit02", { width: "830px", ...animDefaults }, "-=0.35")
    .to(".tit02 .tit", { autoAlpha: 1, ...animDefaults });


    $('.btn_esg').on('click', function(){
        tl.play();
    });
</script>
